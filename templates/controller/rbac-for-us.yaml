{{- /* RBAC */ -}}
{{- /*
  controllerMetricsProxyPort is not used as a port here. It is how
  helm_lib_module_controller_rbac learns that the pod carries a kube-rbac-proxy in
  front of the metrics, and therefore needs the ClusterRoleBinding to d8:rbac-proxy
  that lets the sidecar create the TokenReview and SubjectAccessReview every scrape
  is authorised with. Keep it in step with the value given to
  helm_lib_module_controller_manifests: without it the proxy fails closed on every
  scrape and the only symptom is up == 0 and a permanent TargetDown.
*/ -}}
{{- $rbacConfig := dict
  "controllerMetricsProxyPort" (int .Values.csiCeph.internal.controllerMetricsProxyPort)
  "roleRules" (list
    (dict "apiGroups" (list "") "resources" (list "secrets" "configmaps") "verbs" (list "get" "list" "watch" "create" "update" "delete"))
    (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "create" "patch"))
    (dict "apiGroups" (list "coordination.k8s.io") "resources" (list "leases") "verbs" (list "get" "watch" "list" "delete" "update" "create"))
  )
  "clusterRoleRules" (list
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "cephstorageclasses" "cephstorageclasses/status" "cephclusterconnections" "cephclusterconnections/status" "cephclusterauthentications" "cephclusterauthentications/status") "verbs" (list "get" "list" "create" "watch" "update"))
    (dict "apiGroups" (list "storage.k8s.io") "resources" (list "storageclasses") "verbs" (list "create" "delete" "list" "get" "watch" "update"))
    (dict "apiGroups" (list "storage.k8s.io") "resources" (list "volumeattachments") "verbs" (list "list" "get" "watch"))
    (dict "apiGroups" (list "") "resources" (list "persistentvolumes") "verbs" (list "list" "get" "watch"))
    (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshotclasses") "verbs" (list "create" "delete" "list" "get" "watch" "update"))
    (dict "apiGroups" (list "snapshot.storage.k8s.io") "resources" (list "volumesnapshotcontents") "verbs" (list "list" "get" "watch"))
  )
}}
{{ include "helm_lib_module_controller_rbac" (list . $rbacConfig) }}
