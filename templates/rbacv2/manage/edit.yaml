{{- if eq (include "csi-ceph.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:csi-ceph:edit
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-storage-as" "manager" "rbac.deckhouse.io/capability" "system-capability.csi-ceph.edit" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/namespace" "d8-csi-ceph" "rbac.deckhouse.io/scope" "system")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Manage the csi-ceph module configuration."
    en.meta.deckhouse.io/title: "Module csi-ceph: edit configuration"
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля csi-ceph."
    ru.meta.deckhouse.io/title: "Модуль csi-ceph: управление конфигурацией"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - csi-ceph
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - storage.deckhouse.io
  resources:
  - cephclusterauthentications
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - cephclusterauthentications/sensitive
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - cephclusterconnections
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - cephclusterconnections/sensitive
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - cephstorageclasses
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-ceph
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-csi-ceph
  name: d8:manage:permission:module:csi-ceph:edit
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - cephclusterconnections
      - cephclusterauthentications
      - cephclusterconnections/sensitive
      - cephclusterauthentications/sensitive
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - cephstorageclasses
      - cephclusterconnections
      - cephclusterauthentications
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}
