{{- if eq (include "csi-ceph.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-ceph
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.csi-ceph.edit"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-csi-ceph
  name: d8:system-capability:csi-ceph:edit
  annotations:
    en.meta.deckhouse.io/title: "Module csi-ceph: manage cluster resources"
    ru.meta.deckhouse.io/title: "Модуль csi-ceph: управление кластерными ресурсами"
    en.meta.deckhouse.io/description: "Create, update and delete the cluster-scoped resources of the csi-ceph module (CephClusterConnection, CephClusterAuthentication, CephStorageClass, CephMetadataBackup)."
    ru.meta.deckhouse.io/description: "Создание, изменение и удаление кластерных ресурсов модуля csi-ceph (CephClusterConnection, CephClusterAuthentication, CephStorageClass, CephMetadataBackup)."
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - cephstorageclasses
      - cephclusterconnections
      - cephclusterauthentications
      - cephmetadatabackups
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-ceph
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-csi-ceph
  name: d8:manage:permission:module:csi-ceph:edit
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - cephstorageclasses
      - cephclusterconnections
      - cephclusterauthentications
      - cephmetadatabackups
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}
