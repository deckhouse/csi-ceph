{{- if eq (include "csi-ceph.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-ceph
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.csi-ceph.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-csi-ceph
  name: d8:system-capability:csi-ceph:view
  annotations:
    en.meta.deckhouse.io/title: "Module csi-ceph: view cluster resources"
    ru.meta.deckhouse.io/title: "Модуль csi-ceph: просмотр кластерных ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to the cluster-scoped resources of the csi-ceph module (CephClusterConnection, CephClusterAuthentication, CephStorageClass, CephMetadataBackup)."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к кластерным ресурсам модуля csi-ceph (CephClusterConnection, CephClusterAuthentication, CephStorageClass, CephMetadataBackup)."
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - cephstorageclasses
      - cephclusterconnections
      - cephclusterauthentications
      - cephmetadatabackups
    verbs:
      - get
      - list
      - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-ceph
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-csi-ceph
  name: d8:manage:permission:module:csi-ceph:view
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - cephstorageclasses
      - cephclusterconnections
      - cephclusterauthentications
      - cephmetadatabackups
    verbs:
      - get
      - list
      - watch
{{- end }}
