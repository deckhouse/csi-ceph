{{- if eq (include "csi-ceph.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:csi-ceph:view
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-storage-as" "viewer" "rbac.deckhouse.io/capability" "system-capability.csi-ceph.view" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/namespace" "d8-csi-ceph" "rbac.deckhouse.io/scope" "system")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Read-only access to the csi-ceph module configuration."
    en.meta.deckhouse.io/title: "Module csi-ceph: view configuration"
    ru.meta.deckhouse.io/description: "Доступ только на чтение к конфигурации модуля csi-ceph."
    ru.meta.deckhouse.io/title: "Модуль csi-ceph: просмотр конфигурации"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - csi-ceph
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.deckhouse.io
  resources:
  - cephstorageclasses
  verbs:
  - get
  - list
  - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: csi-ceph
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-csi-ceph
  name: d8:manage:permission:module:csi-ceph:view
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - cephstorageclasses
    verbs:
      - get
      - list
      - watch
{{- end }}
