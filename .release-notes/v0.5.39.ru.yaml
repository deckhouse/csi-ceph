date: "2026-10-26"

summary: "CSI-контроллеры и узловые плагины RBD и CephFS поставляются с объектами `SecurityPolicyException`, которые DKP 1.79 требует для системных подов, контроллерный плагин RBD больше не работает в привилегированном режиме, а из образов модуля убраны уязвимости Go-зависимостей, найденные сканером."

highlights:
  - "Модуль поставляет `SecurityPolicyException` для каждого CSI-контроллера и узлового плагина RBD и CephFS в `d8-csi-ceph`, поэтому эти поды продолжат запускаться, когда в DKP 1.79 стандарты безопасности подов (Pod Security Standards) в системных пространствах имён перейдут от предупреждения к запрету."
  - "Контейнер `rbdplugin` CSI-контроллера RBD работает без привилегий, без `SYS_ADMIN` и со сброшенными capabilities (привилегиями ядра Linux)."

improvements:
  - "Deployment CSI-контроллеров и DaemonSet узловых плагинов RBD и CephFS получают `SecurityPolicyException` с описанием каждой привилегии, которая нужна им сверх профиля `restricted`, а их поды — метку `security.deckhouse.io/security-policy-exception`, ссылающуюся на этот объект. Объекты создаются, только если в кластере доступен ресурс `SecurityPolicyException` (включён модуль `admission-policy-engine-crd`); на более ранних платформах ничего не меняется."

security:
  - "Контейнер `rbdplugin` CSI-контроллера RBD больше не запускается с `privileged: true` и capability `SYS_ADMIN`: все capabilities сброшены, задано `allowPrivilegeEscalation: false`. Контроллер только обращается к кластеру Ceph и никогда не подключает и не монтирует образы, и в исходном проекте ceph-csi этот контейнер тоже работает без привилегий. Узловые плагины RBD и CephFS не изменились."
  - "Обновлены Go-зависимости бинарного файла ceph-csi, контроллера модуля, вебхуков и хуков, что убирает CVE-2026-78669, CVE-2026-78659, CVE-2026-78660, CVE-2026-78663, CVE-2026-97032, CVE-2026-56851, CVE-2026-63209 и CVE-2026-85747 из результатов сканирования образов модуля."

upgrade_notes:
  - "Руками делать ничего не нужно. Поды CSI-контроллера RBD один раз перезапускаются из-за нового контекста безопасности; там, где доступен ресурс `SecurityPolicyException`, поды CSI-контроллеров и узловых плагинов RBD и CephFS тоже один раз перезапускаются, чтобы получить новую метку."
