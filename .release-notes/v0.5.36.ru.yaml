date: "2026-09-14"

summary: "Небольшой релиз: модуль по умолчанию пишет логи на уровне `INFO`, а пин `golang.org/x/crypto` больше не показывается сканерами как критичная находка в образе хуков."

highlights:
  - "Значение `logLevel` по умолчанию теперь `INFO`, а не `DEBUG`, поэтому кластер, где параметр не задан явно, получает от модуля заметно меньше логов."
  - "Пин `golang.org/x/crypto` поднят до v0.57.0, что убирает CVE-2026-56854, CVE-2026-56855 и CVE-2026-78662 из результатов сканирования образа хуков модуля."

improvements:
  - "Значение `logLevel` по умолчанию теперь `INFO`, а не `DEBUG` — его получит кластер, в котором параметр не задан явно."

security:
  - "Пин `golang.org/x/crypto` поднят с v0.53.0 до v0.57.0 во всех компонентах, что убирает CVE-2026-56854, CVE-2026-56855 и CVE-2026-78662 из результатов сканирования образа хуков модуля. Ни одна из трёх не была достижима: уязвимый пакет `x/crypto/ssh` не попадает ни в один поставляемый модулем бинарный файл, поэтому исправлена находка сканера, а не эксплуатируемая уязвимость."

upgrade_notes:
  - "Руками делать ничего не нужно. Кластеру, который полагался на прежнюю подробность логов, следует явно задать `logLevel: DEBUG` в конфигурации модуля, поскольку значение по умолчанию теперь `INFO`."
