date: "2026-11-12"

summary: "В DKP 1.78 и новее роли просмотра и редактирования модуля охватывают и его ModuleConfig, в FAQ описано, как снимки и восстановленные тома зависят друг от друга, а образы пересобраны на базовых образах v4.0.12 с Go 1.27.4."

highlights:
  - "В DKP 1.78 и новее роли `d8:system-capability:csi-ceph:view` и `d8:system-capability:csi-ceph:edit` дают также доступ на чтение и запись к ModuleConfig `csi-ceph`."
  - "В FAQ описано, в каком порядке можно удалять снимки и восстановленные тома и почему удалённый образ RBD может остаться в корзине RBD."

improvements:
  - "В DKP 1.78 и новее роли `d8:system-capability:csi-ceph:view` и `d8:system-capability:csi-ceph:edit` дают также доступ на чтение к ModuleConfig `csi-ceph`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability (роли-возможности) ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него; кластеры ниже DKP 1.78 сохраняют прежние роли."

docs:
  - "В FAQ описано, что происходит со снапшотами и восстановленными томами, когда один из них удаляют: удалять можно в любом порядке, том RBD, восстановленный из снапшота, — клон copy-on-write (копирование при записи), который ceph-csi в фоне отвязывает от родителя, когда цепочка становится глубокой, удалённый образ RBD ждёт в корзине RBD, пока от него зависят снапшоты или восстановленные тома, а том CephFS с доступом на запись, восстановленный из снапшота, — полная копия."

dependencies:
  - name: base images
    from: "v4.0.7"
    to: "v4.0.12"
    notes: "Все образы модуля пересобраны на актуальных базовых образах."
  - name: Go
    from: "1.27.3"
    to: "1.27.4"
    notes: "Тулчейн (набор инструментов сборки), которым собираются компоненты модуля на Go."
