date: "2026-11-19"

summary: "The Ceph user keys of connections are no longer readable below `ClusterEditor` and are masked as sensitive data on DKP 1.77 and later, `CephMetadataBackup` is left to `SuperAdmin`, the migration from the `ceph-csi` module no longer stops on volumes without an expansion secret or on volumes that already exist, and the module needs less memory on master nodes."

highlights:
  - "The `spec.userKey` fields of `CephClusterConnection` and `CephClusterAuthentication` are marked as sensitive data: on DKP 1.77 and later the API returns `<omitted>` instead of the Ceph user key to callers not allowed to read the `/sensitive` subresource. Read the upgrade notes before the update."
  - "The access levels below `ClusterEditor` no longer read `CephClusterConnection` and `CephClusterAuthentication`, and only `SuperAdmin` reads and writes `CephMetadataBackup`."
  - "The migration from the `ceph-csi` module now moves every PersistentVolume of a storage class to the new Secret, including volumes without a controller expand secret and volumes that already exist."

improvements:
  - "The module needs less memory on master nodes. The controller serves the admission webhooks itself instead of a separate `webhooks` container, and serves its metrics over HTTPS, checking each scrape itself with the same TokenReview and SubjectAccessReview, instead of a kube-rbac-proxy container; the external-resizer of the RBD and CephFS CSI controllers no longer keeps an informer over every Pod of the cluster; the CephFS CSI controller runs without the external-attacher, which has no work, as the `cephfs.csi.ceph.com` CSIDriver has `attachRequired: false`; and the controller no longer keeps `managedFields` of the objects it caches. The webhook Service, the metrics port, the ServiceMonitor and the access rules stay the same; the Pods of the controller and of both CSI controllers are recreated once during the update."
  - "In HA mode the RBD and CephFS CSI controllers and the module controller run two replicas instead of one per master node, and one replica on a cluster with a single master node."

fixes:
  - "The migration from the `ceph-csi` module no longer panics on a PersistentVolume that has a node stage secret reference but no controller expand secret reference: only the references the volume has are moved to the new Secret."
  - "When no `CephCSIDriver` is being migrated, the migration hook logs a warning with the `CephMetadataBackup` objects whose PersistentVolumes it did not recreate, instead of leaving them unnoticed."
  - "When the migration from the `ceph-csi` module finds that a PersistentVolume it is recreating already exists, it now goes on with the remaining PersistentVolumes of the storage class instead of stopping, and marks the `CephCSIDriver` as migrated only after every PersistentVolume references the new Secret. Before, the rest of the class kept the old Secret of the removed module and their volumes failed to mount. An existing PersistentVolume without a controller expand secret reference is now also recognized as the one the migration recreated, instead of failing the hook on every run."

security:
  - "The `User`, `PrivilegedUser`, `Editor` and `Admin` access levels and the RBACv2 roles `d8:manage:storage:viewer` and `d8:manage:all:viewer` no longer read `CephClusterConnection` and `CephClusterAuthentication`, which hold the Ceph user key in plain text; `ClusterEditor`, `ClusterAdmin` and the storage `manager` roles keep reading and changing them. This does not hide the key from every level: the controller copies it to Secrets in `d8-csi-ceph`, and by the access model the levels from `PrivilegedUser` up read Secrets in all namespaces unless multitenancy limits them to their own namespaces. On DKP 1.77 and later the key is also masked in the answers of the API by the `x-kubernetes-sensitive-data` marker described below."
  - "No access level below `SuperAdmin` reads, creates or changes `CephMetadataBackup`: the `ClusterEditor` role and the RBACv2 storage `manager` role no longer write it, and `User` and the storage `viewer` role no longer read it. The security boundary is RBAC: only `SuperAdmin` can write a backup. The migration hook adds a check on top of it: it recreates a PersistentVolume from a backup only while a `CephCSIDriver` is being migrated, and only if the backup holds an RBD or CephFS CSI volume with no other volume source and is named after that volume. The check rejects volumes of other kinds, such as `hostPath`, but cannot tell a backup the hook made from one written by someone allowed to write `CephMetadataBackup`. Before, a `ClusterEditor` could create a backup with any PersistentVolume, a `hostPath` one included, and the hook created that volume."
  - "The `spec.userKey` fields of `CephClusterConnection` and `CephClusterAuthentication` are marked with `x-kubernetes-sensitive-data`. On DKP 1.77 and later the API returns `<omitted>` instead of the Ceph user key to a caller that is not allowed to read the `cephclusterconnections/sensitive` or `cephclusterauthentications/sensitive` subresource, the audit log masks the key, and with `apiserver.encryptionEnabled: true` in `control-plane-manager` the object is encrypted in etcd. Below DKP 1.77 the marker is dropped when the CRD is installed, and the key stays as it was. The subresources are read by the module controller, the admin kubeconfig of the master nodes, the `ClusterAdmin` access level and the RBACv2 storage `manager` role; `ClusterEditor` still creates and changes the resources but sees `<omitted>`, and on update the kube-apiserver keeps the stored key in place of `<omitted>`. The copy of the key in the Secrets of `d8-csi-ceph` is not affected."

upgrade_notes:
  - "Users with the `User`, `PrivilegedUser`, `Editor` or `Admin` access level and subjects bound to `d8:manage:storage:viewer` or `d8:manage:all:viewer` no longer see `CephClusterConnection`, `CephClusterAuthentication` and `CephMetadataBackup`. Give `ClusterEditor` or the storage `manager` role to those who manage Ceph connections. `CephStorageClass` stays readable for every level."
  - "If sds-elastic is enabled, update it first to a release that allows its controller to read `cephclusterconnections/sensitive`. An older sds-elastic sees `<omitted>` in the `CephClusterConnection` it manages and patches it on every reconcile; the key itself stays intact."
  - "Treat the Ceph user keys that could be read from `CephClusterConnection` and `CephClusterAuthentication` before as exposed and rotate them."
  - "With `apiserver.encryptionEnabled: true`, a `CephClusterConnection` or `CephClusterAuthentication` is encrypted in etcd at its next write. To encrypt the existing ones at once, rewrite them: `d8 k get cephclusterconnections -o json | d8 k replace -f -` and the same for `cephclusterauthentications`."
  - "Make `d8 backup cluster-config` backups as a cluster administrator (`cluster-admin`): a user without access to the sensitive subresources gets `<omitted>` instead of the key in the backup, and such a backup cannot be restored."
  - "Do not remove the marker while encryption in etcd is on, for example by rolling the module back to a release without it: the kube-apiserver cannot read the encrypted `CephClusterConnection` and `CephClusterAuthentication` objects any more."

known_issues:
  - "The CSIDriver object `cephfs.csi.ceph.com` had `attachRequired: true` only in module v0.1.0 (2024), and the field cannot be changed in place. If such an object is still in the cluster, Pods with CephFS volumes stay in `ContainerCreating` after the update, because the CephFS CSI controller no longer runs the external-attacher. Before the update, check that `d8 k get csidriver cephfs.csi.ceph.com -o jsonpath='{.spec.attachRequired}'` prints `false`; if it prints `true`, contact technical support before updating."

docs:
  - "The documentation names the `storage-foundation` module, not `snapshot-controller`, as the module that volume snapshots require, and no longer asks to enable `snapshot-controller`."
