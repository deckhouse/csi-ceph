date: "2026-09-10"

summary: "StorageClass для RBD теперь может оставлять часть файловой системы под нужды суперпользователя, контроллер модуля отдаёт метрики в Prometheus, а драйвер Ceph CSI обновлён до v3.16.3."

highlights:
  - "`CephStorageClass` может через аннотацию `storage.deckhouse.io/ext4-reserved-percent` попросить резервировать долю каждого нового тома с ext4 под суперпользователя."
  - "Контроллер модуля публикует свои метрики — число и длительность reconcile, глубину очереди, задержки обращений к API, — и Prometheus собирает их через `ServiceMonitor`."
  - "Ceph CSI обновлён с v3.15.1 до v3.16.3."

new_features:
  - "`CephStorageClass` принимает аннотацию `storage.deckhouse.io/ext4-reserved-percent`: целое число процентов от 0 до 50, которое `mkfs.ext4` оставляет суперпользователю. Работает для классов с `type: RBD`, чьи тома форматируются в ext4, и игнорируется для CephFS и для томов с XFS; по умолчанию не резервируется ничего. Значение вне диапазона или не число переводит `CephStorageClass` в фазу `Failed` с причиной в conditions, а не ломает создание тома позже."
  - "Метрики контроллера отдаются в Prometheus: `ServiceMonitor` собирает их для job `csi-ceph-controller` через kube-rbac-proxy, а сам контроллер держит endpoint на loopback."

improvements:
  - "По умолчанию контроллер пишет логи на уровне `info`, а не `debug`, поэтому на спокойном кластере лог больше не заполняется подробностями каждого reconcile; вернуть прежнюю подробность можно через `LOG_LEVEL=debug`."

fixes:
  - "Правка аннотаций у `CephStorageClass` обрабатывается сразу. Раньше до reconciler доходили только изменения `spec` и меток, поэтому параметр, заданный аннотацией, применялся лишь после того, как ресурс менялся чем-то ещё."
  - "Поды CSI больше не ждут в `ContainerCreating` на свежей установке, пока не появится первый `CephClusterConnection`: ConfigMap `ceph-csi-config`, который создаёт контроллер, монтируется как необязательный, а его замена больше не выводит драйвер из строя на несколько минут."

dependencies:
  - name: ceph-csi
    from: "3.15.1"
    to: "3.16.3"
    changelog_url: "https://github.com/ceph/ceph-csi/releases/tag/v3.16.3"
    notes: "Набор наших патчей пересобран на новом теге: то, что вошло в upstream, убрано, а оставшиеся обновления зависимостей, закрывающие уязвимости 2026 года, сведены в один патч."
