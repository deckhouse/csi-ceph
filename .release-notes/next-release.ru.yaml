fixes:
  - "В логе контейнера `controller` больше не появляется сообщение `[controller-runtime] log.SetLogger(...) was never called; logs will not be displayed` со стеком вызовов. Сообщения кеша controller-runtime и клиента Kubernetes внутри контроллера, например `Failed to watch`, когда контроллер не может получить список ресурсов, раньше отбрасывались; теперь они пишутся в лог контроллера в том же формате, что и остальные его сообщения."
  - "`CephStorageClass`, у которого подключения нет или оно не `Ready`, получает `Ready=False` с причиной `WaitingForDependency` вместо `ReconcileFailed` (подключения нет) или `Ready=True` (подключение не `Ready`, например пока оно удаляется) и становится `Ready=True`, как только подключение становится `Ready=True`: контроллер классов теперь следит за `CephClusterConnection`. Пока подключение существует, StorageClass и VolumeSnapshotClass по-прежнему создаются и обновляются, а алерт `D8CsiCephStorageClassNotReady` называет подключение. `ClusterConfigConflict` подключения не меняет `Ready` его классов."
