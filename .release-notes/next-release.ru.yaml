# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "CephStorageClass и CephClusterConnection теперь создают событие Kubernetes (Event), когда у условия `Ready` меняется статус или причина: `Warning` — когда оно становится `False`, `Normal` — когда снова становится `True`. Причина события совпадает с причиной условия, например `ReconcileFailed` или `PersistentVolumesExist`, поэтому в `kubectl describe` видно, когда ресурс сломался и когда восстановился. Если проход согласования ничего не изменил, событие не создаётся. Оба ресурса кластерные, поэтому их события лежат в пространстве имён `default`, и контроллеру выдано право создавать их там."

improvements:
  - "CephStorageClass больше нельзя создать с именем StorageClass другого провижинера. Модуль называет свой StorageClass по имени CephStorageClass, поэтому такой ресурс раньше создавался и оставался в состоянии `Failed`; теперь вебхук отклоняет его при создании и называет StorageClass, который занимает имя."

docs:
  - "В FAQ описано, почему том RBD не подключается с ошибкой `map failed: (13) Permission denied` после переезда пода с упавшего узла: пользователю Ceph не разрешено заносить прежнего владельца блокировки в blocklist. Приведены соответствующие строки `dmesg`, нужные права mon (`profile rbd` или `allow command \"osd blocklist\"`, а не `osd blacklist` из версий до Ceph 16) и способ вручную снять повисшую блокировку. В примере прав для RBD объяснено, зачем в правах mon нужен `profile rbd`."

