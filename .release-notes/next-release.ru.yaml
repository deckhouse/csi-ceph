# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "Алерты `D8CsiCephStorageConnectionNotReady` и `D8CsiCephStorageClassNotReady` срабатывают, если условие `Ready` у `CephClusterConnection` или `CephStorageClass` не равно `True` 15 минут. Они строятся на новой метрике контроллера `csi_ceph_resource_ready` и ссылаются на новый раздел FAQ об условиях и причинах в статусе."
  - "В `status.capacity` CephStorageClass типа `RBD` появились два необязательных поля: `allocated` — выделенный размер томов и снапшотов этого кластера Kubernetes в пуле (ёмкость его PersistentVolume и `restoreSize` его VolumeSnapshotContent), и `heldByDeleted` — данные, которые образы удалённых томов в корзине RBD ещё занимают вместе со своими снапшотами. Оба поля обновляются раз в 10 минут; `heldByDeleted` не заполняется, если у образа в корзине нет функции `fast-diff`."
improvements:
  - "`kubectl get` показывает причину условия `Ready` и мониторы у `CephClusterConnection`, а у `CephStorageClass` — причину, подключение и пул RBD. Оба вида ресурсов входят в категорию `d8-storage`, подключения — также в `d8-storage-connections`, классы — в `d8-storage-classes`, поэтому `kubectl get d8-storage-classes` выводит классы всех модулей хранения."
upgrade_notes:
  - "Колонка `Phase` у `CephClusterConnection` и `CephStorageClass` выводится только в `kubectl get -o wide`, а в колонке `Reason` теперь причина условия `Ready`, а не `status.reason`. Скриптам, которые разбирают колонки, нужно читать `.status.conditions`."
  - "Алерты `StorageClassNewCephClusterConnectionCreated`, `StorageClassCephClusterAuthenticationNotMigrated`, `StorageClassPossibleProblemWithAllowVolumeExpansion`, `StorageClassPossibleProblemWithMountOptions`, `StorageClassPossibleProblemWithCephfsPool`, `CsiCephRBDVolumeWithoutWatch` устарели и будут удалены в следующем минорном релизе. Их заменяют, в том же порядке, `D8CsiCephStorageClassNewCephClusterConnectionCreated`, `D8CsiCephStorageClassCephClusterAuthenticationNotMigrated`, `D8CsiCephStorageClassPossibleProblemWithAllowVolumeExpansion`, `D8CsiCephStorageClassPossibleProblemWithMountOptions`, `D8CsiCephStorageClassPossibleProblemWithCephfsPool`, `D8CsiCephRBDVolumeWithoutWatch`, которые срабатывают при тех же условиях; пока старые имена не удалены, срабатывают оба. Обновите заглушки (silences) и маршруты, которые выбирают старые имена."
  - "Поля `status.phase` и `status.reason` у `CephClusterConnection` и `CephStorageClass` устарели. `phase` вычисляется из условия `Ready` и отсутствует, пока `Ready` равно `Unknown`; читайте `.status.conditions`. В следующей версии API поля `phase` не будет. `status.reason` теперь повторяет сообщение условия `Ready`, в том числе текст ошибки неудачного прохода, а не сводку, которую дал проход."

