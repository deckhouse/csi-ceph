date: "2026-11-19"

summary: "Ключи пользователей Ceph в ресурсах подключения больше не читаются уровнями ниже `ClusterEditor` и в DKP 1.77 и новее маскируются как чувствительные данные, `CephMetadataBackup` доступен только `SuperAdmin`, миграция с модуля `ceph-csi` больше не останавливается на томах без секрета расширения и на уже существующих томах, а модуль потребляет меньше памяти на master-узлах."

highlights:
  - "Поля `spec.userKey` ресурсов `CephClusterConnection` и `CephClusterAuthentication` помечены как чувствительные данные: в DKP 1.77 и новее API возвращает `<omitted>` вместо ключа пользователя Ceph тем, кому не разрешено читать подресурс `/sensitive`. Перед обновлением прочитайте указания по обновлению."
  - "Уровни доступа ниже `ClusterEditor` больше не читают `CephClusterConnection` и `CephClusterAuthentication`, а `CephMetadataBackup` читает и записывает только `SuperAdmin`."
  - "Миграция с модуля `ceph-csi` теперь переводит на новый Secret все PersistentVolume класса хранения, в том числе тома без секрета для расширения и уже существующие тома."

improvements:
  - "Модуль потребляет меньше памяти на master-узлах. Контроллер сам обслуживает admission-вебхуки (webhooks — проверки запросов к API) вместо отдельного контейнера `webhooks` и сам отдаёт метрики по HTTPS, проверяя каждый запрос метрик теми же TokenReview и SubjectAccessReview, вместо контейнера kube-rbac-proxy; external-resizer CSI-контроллеров RBD и CephFS больше не держит информер (informer — локальный кэш объектов с подпиской на изменения) по всем подам кластера; CSI-контроллер CephFS работает без external-attacher, у которого нет работы, так как у CSIDriver `cephfs.csi.ceph.com` задано `attachRequired: false`; контроллер больше не хранит `managedFields` кэшируемых объектов. Service вебхуков, порт метрик, ServiceMonitor и правила доступа не меняются; поды контроллера и обоих CSI-контроллеров при обновлении пересоздаются один раз."
  - "В режиме HA CSI-контроллеры RBD и CephFS и контроллер модуля работают в двух репликах вместо одной на каждый master-узел и в одной реплике в кластере с одним master-узлом."

fixes:
  - "Миграция с модуля `ceph-csi` больше не падает с паникой на PersistentVolume, у которого есть ссылка на секрет для NodeStage, но нет ссылки на секрет для расширения тома: на новый Secret переводятся только те ссылки, которые есть у тома."
  - "Если ни один `CephCSIDriver` не мигрирует, хук миграции пишет в лог предупреждение со списком `CephMetadataBackup`, по которым PersistentVolume не воссозданы, а не оставляет их незамеченными."
  - "Если при миграции с модуля `ceph-csi` пересоздаваемый PersistentVolume уже существует, миграция продолжает обрабатывать остальные PersistentVolume класса хранения, а не останавливается, и помечает `CephCSIDriver` мигрированным, только когда все PersistentVolume ссылаются на новый Secret. Раньше остальные тома класса оставались со старым Secret удалённого модуля и не монтировались. Кроме того, существующий PersistentVolume без ссылки на секрет для расширения тома теперь распознаётся как пересозданный миграцией, а не приводит к ошибке хука при каждом запуске."

security:
  - "Уровни доступа `User`, `PrivilegedUser`, `Editor` и `Admin` и роли RBACv2 `d8:manage:storage:viewer` и `d8:manage:all:viewer` больше не читают `CephClusterConnection` и `CephClusterAuthentication`, в которых ключ пользователя Ceph хранится открытым текстом; `ClusterEditor`, `ClusterAdmin` и роли `manager` подсистемы storage по-прежнему читают и изменяют эти ресурсы. Это не скрывает ключ от всех уровней: контроллер копирует его в объекты Secret в `d8-csi-ceph`, а по модели доступа уровни начиная с `PrivilegedUser` читают Secret во всех пространствах имён, если режим multitenancy не ограничивает их собственными пространствами имён. В DKP 1.77 и новее ключ, кроме того, маскируется в ответах API маркером `x-kubernetes-sensitive-data`, описанным ниже."
  - "Ни один уровень доступа ниже `SuperAdmin` не читает, не создаёт и не изменяет `CephMetadataBackup`: роль `ClusterEditor` и роль `manager` подсистемы storage в RBACv2 больше не пишут этот ресурс, а `User` и роль `viewer` подсистемы storage не читают. Граница безопасности — RBAC: записывать резервные копии может только `SuperAdmin`. Хук миграции добавляет к этому дополнительную проверку: он воссоздаёт PersistentVolume из резервной копии только во время миграции `CephCSIDriver` и только если копия содержит CSI-том RBD или CephFS без других источников тома и названа по этому тому. Проверка отсекает тома других видов, например `hostPath`, но не отличает копию, сделанную хуком, от копии, записанной тем, кому разрешена запись `CephMetadataBackup`. Раньше `ClusterEditor` мог создать копию с любым PersistentVolume, в том числе `hostPath`, и хук создавал этот том."
  - "Поля `spec.userKey` ресурсов `CephClusterConnection` и `CephClusterAuthentication` помечены маркером `x-kubernetes-sensitive-data`. В DKP 1.77 и новее API возвращает `<omitted>` вместо ключа пользователя Ceph тому, кому не разрешено читать подресурс `cephclusterconnections/sensitive` или `cephclusterauthentications/sensitive`, в журнале аудита ключ маскируется, а при `apiserver.encryptionEnabled: true` в `control-plane-manager` объект шифруется в etcd. В DKP ниже 1.77 маркер отбрасывается при установке CRD, и ключ остаётся как раньше. Подресурсы читают контроллер модуля, административный kubeconfig master-узлов, уровень доступа `ClusterAdmin` и роль RBACv2 `manager` подсистемы storage; `ClusterEditor` по-прежнему создаёт и изменяет ресурсы, но видит `<omitted>`, а при обновлении kube-apiserver сохраняет записанный ключ вместо `<omitted>`. Копию ключа в объектах Secret в `d8-csi-ceph` это не затрагивает."

upgrade_notes:
  - "Пользователи с уровнем доступа `User`, `PrivilegedUser`, `Editor` или `Admin` и субъекты, привязанные к `d8:manage:storage:viewer` или `d8:manage:all:viewer`, больше не видят `CephClusterConnection`, `CephClusterAuthentication` и `CephMetadataBackup`. Тем, кто управляет подключениями к Ceph, выдайте `ClusterEditor` или роль `manager` подсистемы storage. `CephStorageClass` по-прежнему доступен на чтение всем уровням."
  - "Если включён модуль sds-elastic, сначала обновите его до релиза, в котором его контроллеру разрешено читать `cephclusterconnections/sensitive`. Более старый sds-elastic видит `<omitted>` в своём `CephClusterConnection` и изменяет его при каждой reconciliation; сам ключ при этом не портится."
  - "Ключи пользователей Ceph, которые раньше можно было прочитать из `CephClusterConnection` и `CephClusterAuthentication`, считайте раскрытыми и смените их."
  - "При `apiserver.encryptionEnabled: true` объект `CephClusterConnection` или `CephClusterAuthentication` шифруется в etcd при следующей записи. Чтобы зашифровать существующие объекты сразу, перезапишите их: `d8 k get cephclusterconnections -o json | d8 k replace -f -` и так же для `cephclusterauthentications`."
  - "Делайте резервные копии `d8 backup cluster-config` от имени администратора кластера (`cluster-admin`): у пользователя без доступа к подресурсам `/sensitive` в копию вместо ключа попадёт `<omitted>`, и такую копию нельзя восстановить."
  - "Не снимайте маркер при включённом шифровании в etcd, например откатом модуля на релиз без маркера: kube-apiserver перестанет читать зашифрованные объекты `CephClusterConnection` и `CephClusterAuthentication`."

known_issues:
  - "Объект CSIDriver `cephfs.csi.ceph.com` имел `attachRequired: true` только в версии модуля v0.1.0 (2024), а изменить это поле на месте нельзя. Если такой объект остался в кластере, после обновления поды с томами CephFS останутся в состоянии `ContainerCreating`, потому что CSI-контроллер CephFS больше не запускает external-attacher. Перед обновлением проверьте, что `d8 k get csidriver cephfs.csi.ceph.com -o jsonpath='{.spec.attachRequired}'` выводит `false`; если выводит `true`, обратитесь в техническую поддержку до обновления."

docs:
  - "Документация называет модуль `storage-foundation`, а не `snapshot-controller`, модулем, который требуется для снимков томов, и больше не предлагает включать `snapshot-controller`."
