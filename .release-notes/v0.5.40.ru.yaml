date: "2026-11-05"

summary: "CephStorageClass и CephClusterConnection создают события Kubernetes при смене условия `Ready`, StorageClass модуля обновляются на месте и помечаются именем модуля, CephStorageClass больше нельзя создать с именем чужого StorageClass, а в бинарном файле ceph-csi и компонентах модуля больше нет найденных уязвимостей `go-jose` и `golang.org/x/net`."

highlights:
  - "CephStorageClass и CephClusterConnection создают событие `Warning`, когда условие `Ready` становится `False`, и событие `Normal`, когда оно снова становится `True`, поэтому в `kubectl describe` видно, когда ресурс сломался и когда восстановился."
  - "Изменение меток или аннотаций StorageClass модуля больше не удаляет и не создаёт его заново, поэтому PersistentVolumeClaim, созданные в этот момент, больше не остаются без тома."
  - "Бинарный файл ceph-csi собирается с `github.com/go-jose/go-jose/v4` v4.1.6 и `golang.org/x/net` v0.62.0, что закрывает CVE-2026-116587, CVE-2026-116585, CVE-2026-116586, CVE-2026-78661 и CVE-2026-97045."

new_features:
  - "CephStorageClass и CephClusterConnection теперь создают событие Kubernetes (Event), когда у условия `Ready` меняется статус или причина: `Warning` — когда оно становится `False`, `Normal` — когда снова становится `True`. Причина события совпадает с причиной условия, например `ReconcileFailed` или `PersistentVolumesExist`, поэтому в `kubectl describe` видно, когда ресурс сломался и когда восстановился. Если проход согласования ничего не изменил, событие не создаётся. Оба ресурса кластерные, поэтому их события лежат в пространстве имён `default`, и контроллеру выдано право создавать их там."

improvements:
  - "CephStorageClass больше нельзя создать с именем StorageClass другого провижинера. Модуль называет свой StorageClass по имени CephStorageClass, поэтому такой ресурс раньше создавался и оставался в состоянии `Failed`; теперь вебхук отклоняет его при создании и называет StorageClass, который занимает имя."
  - "Вебхук проверки StorageClass пишет сообщения через логгер модуля: они следуют `logLevel` модуля и выводятся в JSON, как остальной журнал пода, а не текстом klog с фиксированным уровнем."

fixes:
  - "Изменение меток или аннотаций StorageClass, созданного модулем, теперь применяется к существующему StorageClass, а не удаляет его и не создаёт заново. При пересоздании класс на мгновение пропадал, и PersistentVolumeClaim, пришедший в этот момент, не мог получить том. Изменение параметров, провижинера, политики освобождения (reclaim policy) или режима привязки тома (volume binding mode) по-прежнему пересоздаёт StorageClass."
  - "Метка `storage.deckhouse.io/managed-by` на StorageClass, которые создаёт модуль, теперь содержит имя модуля — `csi-ceph` — вместо `d8-ceph-storage-class-controller`. Существующие StorageClass получают новое значение при первом согласовании после обновления, без пересоздания. Селекторы меток и запросы мониторинга по старому значению нужно обновить. На других объектах модуля, например VolumeSnapshotClass и Secret, значение метки не меняется."

security:
  - "В бинарном файле ceph-csi `github.com/go-jose/go-jose/v4` обновлён с v4.1.4 до v4.1.6, что закрывает CVE-2026-116587, CVE-2026-116585 и CVE-2026-116586, а `golang.org/x/net` — с v0.60.0 до v0.62.0, что закрывает CVE-2026-78661 и CVE-2026-97045."
  - "`golang.org/x/net` обновлён с v0.60.0 до v0.62.0 в контроллере, вебхуках и хуках модуля, что закрывает CVE-2026-78661 и CVE-2026-97045."

upgrade_notes:
  - "Вручную ничего делать не нужно, кроме селекторов меток, запросов мониторинга и автоматизации, которые ищут StorageClass по `storage.deckhouse.io/managed-by: d8-ceph-storage-class-controller`: их нужно перевести на `csi-ceph`. Существующие StorageClass получают новую метку на месте, а проверка имени CephStorageClass действует только для ресурсов, созданных после обновления."

docs:
  - "В FAQ описано, почему том RBD не подключается с ошибкой `map failed: (13) Permission denied` после переезда пода с упавшего узла: пользователю Ceph не разрешено заносить прежнего владельца блокировки в blocklist. Приведены соответствующие строки `dmesg`, нужные права mon (`profile rbd` или `allow command \"osd blocklist\"`, а не `osd blacklist` из версий до Ceph 16) и способ вручную снять повисшую блокировку. В примере прав для RBD объяснено, зачем в правах mon нужен `profile rbd`."
