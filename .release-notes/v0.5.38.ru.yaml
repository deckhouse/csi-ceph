date: "2026-10-19"

summary: "Драйверы ceph-csi и CSI-сайдкары (sidecar — вспомогательные контейнеры CSI-драйвера) пишут логи с подробностью, заданной `logLevel` модуля, а не всегда на уровне трассировки."

highlights:
  - "Плагины ceph-csi для RBD и CephFS и CSI-сайдкары модуля берут подробность klog из `logLevel` в ModuleConfig `csi-ceph`. При значении по умолчанию `INFO` они запускаются с `--v=2` вместо `--v=5`, и объём их логов заметно уменьшается."

improvements:
  - "Подробность klog у плагинов ceph-csi для RBD и CephFS (controller и node) и у CSI-сайдкаров следует `logLevel`: `ERROR` даёт `--v=0`, `WARN` — `--v=1`, `INFO` (по умолчанию) — `--v=2`, `DEBUG` — `--v=4`, `TRACE` — `--v=5`. Раньше все они работали с `--v=5` независимо от `logLevel`."

upgrade_notes:
  - "Поды ceph-csi и CSI-сайдкаров один раз перезапускаются, чтобы получить новые аргументы. Чтобы сохранить прежние подробные логи, задайте `logLevel: TRACE` в ModuleConfig `csi-ceph`."
