fixes:
  - "The log of the `controller` container no longer shows `[controller-runtime] log.SetLogger(...) was never called; logs will not be displayed` with a stack trace. The messages of the controller-runtime cache and of the Kubernetes client inside the controller, such as `Failed to watch` when the controller cannot list a resource, were dropped; they are now written to the controller log in the same format as its other messages."
