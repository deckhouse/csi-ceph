highlights: []

improvements:
  - "On DKP 1.78 and later, the `d8:system-capability:csi-ceph:view` and `d8:system-capability:csi-ceph:edit` roles also give read access to the `csi-ceph` ModuleConfig, and `edit` write access to it, and carry the standard titles and descriptions of the platform, as every capability of the DKP 1.78 role model does. The RBAC of the module is now declared in `rbac.yaml`, and the RBACv2 templates are written from it; clusters below DKP 1.78 keep the roles they had."

docs:
  - "The FAQ explains what happens to snapshots and restored volumes when one of them is deleted: any order is allowed, an RBD volume restored from a snapshot is a copy-on-write clone that ceph-csi flattens in the background once a chain gets deep, a deleted RBD image waits in the RBD trash while snapshots or restored volumes depend on it, and a read-write CephFS volume restored from a snapshot is a full copy."

