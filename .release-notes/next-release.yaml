date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "The `D8CsiCephStorageConnectionNotReady` and `D8CsiCephStorageClassNotReady` alerts fire when the `Ready` condition of a `CephClusterConnection` or a `CephStorageClass` has not been `True` for 15 minutes. They read the new `csi_ceph_resource_ready` metric of the controller and link to the new FAQ section on the status conditions and reasons."
  - "`status.capacity` of an `RBD` CephStorageClass gets two optional fields: `allocated`, the provisioned size of the volumes and snapshots this Kubernetes cluster keeps in the pool (the capacity of its PersistentVolumes and the restore size of its VolumeSnapshotContents), and `heldByDeleted`, the data the images of deleted volumes in the RBD trash still hold, with their snapshots. Both are refreshed every 10 minutes; `heldByDeleted` is left out when an image in the trash has no `fast-diff` feature."
improvements:
  - "`kubectl get` shows the reason of the `Ready` condition and the monitors for `CephClusterConnection`, and the reason, the connection and the RBD pool for `CephStorageClass`. Both kinds are in the `d8-storage` category, connections also in `d8-storage-connections` and classes in `d8-storage-classes`, so `kubectl get d8-storage-classes` lists the classes of every storage module."
upgrade_notes:
  - "The `Phase` column of `CephClusterConnection` and `CephStorageClass` is shown only with `kubectl get -o wide`, and the `Reason` column now holds the reason of the `Ready` condition rather than `status.reason`. Scripts that parse the columns should read `.status.conditions` instead."
  - "The `StorageClassNewCephClusterConnectionCreated`, `StorageClassCephClusterAuthenticationNotMigrated`, `StorageClassPossibleProblemWithAllowVolumeExpansion`, `StorageClassPossibleProblemWithMountOptions`, `StorageClassPossibleProblemWithCephfsPool`, `CsiCephRBDVolumeWithoutWatch` alerts are deprecated and will be removed in the next minor release. `D8CsiCephStorageClassNewCephClusterConnectionCreated`, `D8CsiCephStorageClassCephClusterAuthenticationNotMigrated`, `D8CsiCephStorageClassPossibleProblemWithAllowVolumeExpansion`, `D8CsiCephStorageClassPossibleProblemWithMountOptions`, `D8CsiCephStorageClassPossibleProblemWithCephfsPool`, `D8CsiCephRBDVolumeWithoutWatch` replace them, in the same order, and fire on the same conditions; until the old names are removed, both fire. Update silences and routes that match the old names."

