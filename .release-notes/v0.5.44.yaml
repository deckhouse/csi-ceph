date: "2026-11-24"

summary: "The module now raises an alert when the kernel RBD client of a node has lost its watch on an attached volume, for example after Ceph blocklisted it, an `RBD` CephStorageClass reports the space of its pool in `status.capacity`, and the `controller` Pod starts again on clusters with `ContainerdV2` and the `erofs` snapshotter."

highlights:
  - "New `CsiCephRBDVolumeWithoutWatch` alert and `RBDImageNotWatched` event on the PersistentVolume: an attached RBD volume whose image has fewer watchers than nodes it is attached to, which happens after Ceph adds the kernel client of a node to the OSD blocklist and can leave the volume read-only while the Pod keeps running."
  - "An `RBD` CephStorageClass reports the space of its pool in `status.capacity`: the data stored, the space the pool can still take, the pool quota and the number of images in the RBD trash, which tells why deleting a PVC returned no space."
  - "The `controller` Pod no longer fails with `read-only file system` and no longer stays in `CrashLoopBackOff` on clusters with `ContainerdV2` and the `erofs` snapshotter (DKP CSE, or DKP with `defaultCRI: ContainerdV2`)."

new_features:
  - "The controller checks the watchers of the attached RBD images every five minutes, with the credentials of their `CephClusterConnection` and read-only, and exports the `csi_ceph_rbd_volume_without_watch` and `csi_ceph_rbd_watch_check_success` metrics; `D8CsiCephRBDWatchCheckFailed` fires when the check fails for 30 minutes. The FAQ describes how to confirm the cause and recover the node: drain, reboot, check the filesystems."
  - "An `RBD` CephStorageClass reports the space of its pool in `status.capacity`, as `ceph df` shows it: the data stored (volumes, snapshots, restored volumes and images in the RBD trash), the space the pool can still take, the pool quota and the space left within it, and the number of images in the RBD trash, which tells why deleting a PVC returned no space. `freeOnDisk` is a wide column of `d8 k get cephstorageclass`. The controller reads the pool once a minute with the credentials of the `CephClusterConnection` over one connection per `CephClusterConnection`, shared with the watcher check, and writes the status when a figure moves by more than 1%, when the trash or the quota changes, or every 5 minutes; `csi_ceph_rbd_capacity_read_success` shows whether the last read succeeded."

fixes:
  - "The `controller` Pod now starts on clusters with `ContainerdV2` and the `erofs` snapshotter (DKP CSE, or DKP with `defaultCRI: ContainerdV2`): its image contains the `/etc/webhook/certs` mount point, so the container no longer fails with `read-only file system` and no longer stays in `CrashLoopBackOff`."
  - "Labels with the `fleet.cattle.io/` prefix are no longer copied from the StorageClass resources of the module to the StorageClasses. The default of `storageClassLabelIgnoredPrefixes` listed a misspelled prefix, `fleet.cattle.op/`, so the Rancher Fleet labels were copied."

security:
  - "The OpenTelemetry modules `go.opentelemetry.io/otel`, `metric` and `trace` are raised from v1.44.0 to v1.47.0 in the ceph-csi binary, closing CVE-2026-128085."
