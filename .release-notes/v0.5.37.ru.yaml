date: "2026-10-01"

summary: "Несколько `CephClusterConnection` к одному кластеру Ceph больше не ломают тома друг друга: RBD-тома отключаются с секретом своего подключения, подключение не удаляется, пока оно нужно томам или снимкам, а новое условие показывает тома, которые общая конфигурация ceph-csi обслужить не может. Ceph CSI обновлён до v3.18.0."

highlights:
  - "RBD-тома отключаются с секретом своего `CephClusterConnection`. Раньше при двух подключениях к одному кластеру Ceph отключение могло выполняться от пользователя другого подключения, падать с `Operation not permitted` и оставлять `VolumeAttachment`, из-за чего следующее подключение тома блокировалось ошибкой `Multi-Attach`."
  - "Удаляемый `CephClusterConnection` сохраняет свой Secret и финализатор (finalizer — метка, удерживающая объект от удаления), пока они нужны PersistentVolume или `VolumeSnapshotContent`, и сообщает об этом в условии `Ready` с причиной `PersistentVolumesExist` или `VolumeSnapshotContentsExist`."
  - "Новое условие `ClusterConfigConflict` у `CephClusterConnection` перечисляет тома, которым нужен другой пользователь Ceph или другая группа подтомов CephFS, чем записаны в общей конфигурации ceph-csi для их кластера."

new_features:
  - "У `CephClusterConnection` появилось условие `ClusterConfigConflict`. ceph-csi хранит одну запись конфигурации на кластер Ceph: в ней пользователь одного подключения для RBD и группа подтомов одного подключения для CephFS. Условие равно `True` с причиной `VolumesNeedOtherSettings`, если томам, созданным через подключение, нужен другой пользователь или другая группа, чем в этой записи; в сообщении названы до десяти таких PersistentVolume и подключение, настройки которого хранит запись. В остальных случаях условие равно `False` с причиной `ServedByClusterConfig`. Условие выставляется на каждом подключении к общему кластеру и обновляется, когда перечисленные тома меняют фазу или удаляются. Затронуты RBD-тома, созданные до этого релиза, у подключения которых другой пользователь (их нельзя отключить от узла), и тома CephFS в другой группе подтомов (их можно смонтировать, но нельзя удалить, расширить или снять с них снимок)."
  - "В DKP 1.78 и новее модуль поставляет роли доступа в схеме RBACv2 capability/scope (возможность и область действия): `d8:system-capability:csi-ceph:view` и `d8:system-capability:csi-ceph:edit` для ресурсов `CephClusterConnection`, `CephClusterAuthentication`, `CephStorageClass` и `CephMetadataBackup`. В более ранних версиях DKP роли `d8:manage:permission:module:csi-ceph:view` и `d8:manage:permission:module:csi-ceph:edit` создаются без изменений."

improvements:
  - "Контроллер модуля больше не хранит `managedFields` объектов PersistentVolume и `VolumeAttachment` в своём кеше, где лежат объекты всех CSI-драйверов кластера, поэтому его потребление памяти меньше растёт с числом томов."

fixes:
  - "Каждый RBD StorageClass теперь содержит параметры `csi.storage.k8s.io/controller-publish-secret-name` и `csi.storage.k8s.io/controller-publish-secret-namespace`, поэтому в каждом новом RBD PersistentVolume для отключения указан Secret его собственного `CephClusterConnection`. Раньше ceph-csi брал секрет для отключения из единственной записи конфигурации на кластер Ceph, которую контроллер перезаписывал данными подключения, обработанного последним. При двух подключениях к одному кластеру, например одном для RBD и другом для CephFS, у пользователя которого нет доступа к RBD-пулам, отключение завершалось ошибкой, и том нельзя было подключить на другом узле. Для RBD-томов, созданных до обновления и по-прежнему зависящих от этой записи, запись сохраняет подключение, от которого зависят тома, а удаление одного из подключений к кластеру больше не убирает запись, нужную остальным."
  - "Удаление `CephClusterConnection` больше не оставляет его тома в нерабочем состоянии. Раньше его Secret удалялся сразу, и созданный через него том уже нельзя было отключить, расширить или удалить. Теперь подключение остаётся, пока его Secret нужен хотя бы одному PersistentVolume (подключённому к узлу, в фазе `Bound` или ещё не занятому, либо в фазе `Released`/`Failed` с политикой возврата `Delete`) и пока на него ссылается хотя бы один `VolumeSnapshotContent` с политикой удаления `Delete`. Его условие `Ready` равно `False` с причиной `PersistentVolumesExist` или, если остались только снимки, `VolumeSnapshotContentsExist`, а в сообщении названы до десяти таких объектов. PersistentVolume в фазе `Released` или `Failed` с политикой `Retain`, не подключённый ни к одному узлу, подключение не удерживает, поэтому такой том не блокирует удаление `ElasticCluster` в sds-elastic. Подключение удаляется сразу после исчезновения последнего тома или снимка."
  - "Группа подтомов CephFS в общей записи конфигурации ceph-csi больше не переключается на группу другого `CephClusterConnection`, когда второе подключение к тому же кластеру создаёт свой первый том CephFS. Раньше созданные до этого тома CephFS после такого переключения уже нельзя было удалить или расширить. Теперь группа определяется по `subvolumePath` существующих томов, а мониторы в записи берутся из всех подключений к кластеру."

upgrade_notes:
  - "Контроллер один раз пересоздаёт каждый существующий RBD StorageClass, чтобы добавить параметры секрета для отключения: в Kubernetes `parameters` у StorageClass неизменяемы. Существующие PersistentVolume и PVC не затрагиваются: секрет для отключения есть только у томов, созданных после обновления, а более старые RBD-тома по-прежнему отключаются через общую запись конфигурации ceph-csi."
  - "После обновления проверьте условие `ClusterConfigConflict` в кластерах, где к одному кластеру Ceph ведут несколько `CephClusterConnection`. В FAQ приведена команда, которая выводит затронутые подключения, и описано, как дать перечисленным RBD-томам отключиться: выдать пользователю подключения, настройки которого хранит запись, доступ к их пулам."
  - "Удаление `CephClusterConnection` теперь ждёт, пока не исчезнут PersistentVolume и `VolumeSnapshotContent`, которым нужен его Secret. Чтобы удаление завершилось, удалите их или `VolumeSnapshot` перечисленных объектов `VolumeSnapshotContent`. Для этого контроллер получает права на чтение PersistentVolume, `VolumeAttachment` и `VolumeSnapshotContent`."
  - "В DKP 1.78 и новее роли ClusterRole `d8:manage:permission:module:csi-ceph:*` заменены на `d8:system-capability:csi-ceph:*`. Доступ, выданный через агрегацию ролей Deckhouse, продолжает работать; привязку, созданную вручную к одной из старых ролей, нужно перевести на новое имя."

docs:
  - "В FAQ описано, почему `CephClusterConnection` не удаляется и какие PersistentVolume и `VolumeSnapshotContent` его удерживают, а также что означает условие `ClusterConfigConflict`, как найти затронутые подключения и как дать перечисленным RBD-томам отключиться."

dependencies:
  - name: ceph-csi
    from: "3.16.3"
    to: "3.18.0"
    changelog_url: "https://github.com/ceph/ceph-csi/releases/tag/v3.18.0"
    notes: "Апстрим (исходный проект ceph-csi) уже содержит обновления зависимостей, которые вносил наш патч с исправлениями CVE, поэтому этот патч удалён; два функциональных патча, включая резерв ext4 для суперпользователя, перенесены на новый тег без изменения поведения."
