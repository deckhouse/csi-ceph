Изменения:
  - Модуль snapshot-controller больше не обязательная зависимость: VolumeSnapshotClass создаётся только при наличии CRD snapshot.storage.k8s.io, иначе CephStorageClass обрабатывается без снапшотной части; после установки CRD перезапуск контроллера не требуется
  - Исправление: при отключённом msCrcData управляемые StorageClass переводятся на msgr1 (ms_mode=legacy) — иначе ядерные клиенты krbd и CephFS отбрасывали кадры без CRC и монтирование завершалось таймаутом при исправном кластере
  - Обновление базовых образов, Go 1.26.5 и lib-helm до 1.72.10
  - Устранены уязвимости в сторонних зависимостях
  - Внутренние изменения в сборке модуля и CI, добавлены e2e-тесты
