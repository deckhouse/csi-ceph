apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cephclusterauthentications.storage.deckhouse.io
  labels:
    heritage: deckhouse
    module: csi-ceph
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: storage.deckhouse.io
  scope: Cluster
  names:
    plural: cephclusterauthentications
    singular: cephclusterauthentication
    kind: CephClusterAuthentication
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            Ceph cluster authentication parameters.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - userID
                - userKey
              properties:
                userID:
                  description: |
                    Username without `client.`.
                  type: string
                userKey:
                  description: |
                    Ceph auth key corresponding to the `userID`.
                  type: string
            status:
              type: object
              description: |
                Displays current information about the resources managed by the CephClusterAuthentication custom resource.
              properties:
                phase:
                  type: string
                  description: |
                    Not published for this resource kind. This resource is deprecated and the controller
                    does not reconcile it towards a desired state, so there is no phase to report — see
                    the `Deprecated` condition instead. The field is retained for compatibility.
                  enum:
                    - Failed
                    - Created
                reason:
                  type: string
                  description: |
                    Additional information about the resources managed by the CephClusterAuthentication custom resource.
                observedGeneration:
                  type: integer
                  format: int64
                  description: |
                    The value of `metadata.generation` the controller has last acted on.
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  description: |
                    The latest observations of the resource state. Condition type: `Deprecated`.

                    No `Ready` condition is published: the controller does not reconcile this resource
                    towards a desired state, it only marks it as superseded by CephClusterConnection.
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        description: |
                          Condition type. `Deprecated` is `True` for every CephClusterAuthentication:
                          the kind is superseded by CephClusterConnection, which carries the
                          authentication fields itself.
                      status:
                        type: string
                        description: |
                          Current status of the condition.
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      observedGeneration:
                        type: integer
                        minimum: 0
                        format: int64
                        description: |
                          The value of `metadata.generation` this condition was set against.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: |
                          Timestamp of the last status transition for this condition.
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        description: |
                          Machine-readable reason for the current status, suitable for log filtering
                          and alerting.
                      message:
                        type: string
                        maxLength: 32768
                        description: |
                          Human-readable explanation of the current status.
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Deprecated")].status
          name: Deprecated
          type: string
        - jsonPath: .status.reason
          name: Reason
          type: string
          priority: 1
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
          description: The age of this resource
