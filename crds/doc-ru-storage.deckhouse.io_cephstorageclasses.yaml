spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Интерфейс управления StorageСlass для CSI-драйверов rbd.csi.ceph.com и cephfs.csi.ceph.com. Ручное создание StorageClass для данных драйверов запрещено.
          properties:
            spec:
              description: |
                Определяет конфигурацию StorageClass.
              properties:
                clusterConnectionName:
                  description: |
                    Имя ресурса CephClusterConnection.
                clusterAuthenticationName:
                  description: |
                    Имя ресурса CephClusterAuthentication.
                reclaimPolicy:
                  description: |
                    Режим поведения при удалении PVC. Возможные значения:
                    - Delete (При удалении PVC будет удален PV и данные)
                    - Retain (При удалении PVC не будут удалены PV и данные. Для их удаления потребуется ручное вмешательство администратора)
                type:
                  description: |
                    Тип storage-класса. Возможные значения:
                    - CephFS
                    - RBD (Rados Block Device)
                cephFS:
                  description: |
                    Специфические параметры для CephFS.
                  properties:
                    fsName:
                      description: |
                        Имя файловой системы CephFS.
                rbd:
                  description: |
                    Специфические параметры для Rados Block Device.
                  properties:
                    defaultFSType:
                      description: |
                        Тип файловой системы по умолчанию для Rados Block Device.
                    pool:
                      description: |
                        Имя пула RBD.
            status:
              description: |
                Отображает текущую информацию о StorageClass.
              properties:
                phase:
                  description: |
                    Текущее состояние StorageClass. Возможные состояния:
                    - Failed (если контроллер получил некорректную конфигурацию ресурса или возникли ошибки в процессе выполнения операции)
                    - Created (если все прошло успешно)
                reason:
                  description: |
                    Дополнительная информация о текущем состоянии StorageClass.
                observedGeneration:
                  description: |
                    Значение `metadata.generation`, которое контроллер обработал последним. Если оно
                    отстаёт от `metadata.generation`, значит контроллер ещё не обработал последнее
                    изменение спецификации, и условия ниже описывают предыдущее состояние.
                conditions:
                  description: |
                    Последние наблюдения состояния ресурса. Тип условия: `Ready`.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия. `Ready` принимает значение `True`, когда StorageClass
                          и VolumeSnapshotClass созданы, и `False` — если проход reconcile завершился
                          ошибкой. Пока контроллер не обработал ресурс в первый раз, условие
                          отсутствует.
                      status:
                        description: |
                          Текущий статус условия.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, для которого это условие было выставлено.
                      lastTransitionTime:
                        description: |
                          Время последней смены статуса этого условия. Не обновляется, если изменились
                          только `reason` или `message`.
                      reason:
                        description: |
                          Машиночитаемая причина текущего статуса, пригодная для фильтрации логов
                          и алертинга.
                      message:
                        description: |
                          Человекочитаемое пояснение текущего статуса.
                capacity:
                  description: |
                    Место RBD-пула, в котором класс создаёт тома, по данным `ceph df`. Заполняется только
                    для класса `RBD`. Контроллер читает пул раз в минуту и записывает величины, когда одна из них
                    сдвигается больше чем на 1 % размера, когда меняется число образов в корзине RBD или квота,
                    и не реже раза в 5 минут.
                  properties:
                    pool:
                      description: |
                        Имя RBD-пула.
                    size:
                      description: |
                        Сумма `used` и `freeOnDisk`.
                    used:
                      description: |
                        Данные, записанные в пул, без учёта репликации, — `STORED` в `ceph df`, с округлением вниз до МиБ.
                        Включают тома, их снапшоты, тома, восстановленные из снапшотов, и образы в корзине RBD.
                        Данные, общие для восстановленного тома и его снапшота, учитываются один раз.
                    freeOnDisk:
                      description: |
                        Сколько ещё данных поместится в пул без учёта репликации (`MAX AVAIL` в `ceph df`),
                        с округлением вниз до МиБ: место, которое остаётся на самом заполненном OSD правила CRUSH
                        пула до порога `full_ratio`. Пулы на тех же OSD делят это место между собой, квота пула
                        его не уменьшает.
                    quota:
                      description: |
                        Квота пула в байтах. Отсутствует, если квота не задана.
                    freeByQuota:
                      description: |
                        Сколько ещё данных поместится в пул в пределах квоты: меньшее из разности квоты и `used`
                        и `freeOnDisk`, с округлением вниз до МиБ. Отсутствует, если квота не задана.
                    imagesInTrash:
                      description: |
                        Число образов в корзине RBD пула. Драйвер переносит туда образ удалённого тома, и образ
                        хранит данные, пока от него зависит хотя бы один снапшот или клонированный из него том.
                        `capacity` записывается только после того, как корзина прочитана, поэтому отсутствие
                        поля означает ноль образов.
                    updatedAt:
                      description: |
                        Время, когда величины прочитаны из Ceph.
