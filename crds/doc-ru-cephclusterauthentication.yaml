spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Параметры аутентификации кластера Ceph.
          properties:
            spec:
              properties:
                userID:
                  description: |
                    Имя пользователя без префикса `client.`.
                userKey:
                  description: |
                    Авторизационный ключ Ceph, соответствующий `userID`.
            status:
              description: |
                Отображает текущую информацию о ресурсах, управляемых пользовательским ресурсом CephClusterAuthentication.
              properties:
                phase:
                  description: |
                    Не заполняется для этого типа ресурса. Ресурс устарел, и контроллер не приводит его
                    к желаемому состоянию, поэтому сообщать о фазе нечего — смотрите условие
                    `Deprecated`. Поле сохранено для обратной совместимости.
                reason:
                  description: |
                    Дополнительная информация о ресурсах, управляемых ресурсом CephClusterAuthentication.
                observedGeneration:
                  description: |
                    Значение `metadata.generation`, которое контроллер обработал последним.
                conditions:
                  description: |
                    Последние наблюдения состояния ресурса. Тип условия: `Deprecated`.

                    Условие `Ready` не публикуется: контроллер не приводит этот ресурс к желаемому
                    состоянию, а только помечает его как замещённый ресурсом CephClusterConnection.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия. `Deprecated` равно `True` для любого CephClusterAuthentication:
                          этот тип ресурса замещён CephClusterConnection, который содержит поля
                          аутентификации сам.
                      status:
                        description: |
                          Текущий статус условия.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, для которого это условие было выставлено.
                      lastTransitionTime:
                        description: |
                          Время последней смены статуса этого условия.
                      reason:
                        description: |
                          Машиночитаемая причина текущего статуса, пригодная для фильтрации логов
                          и алертинга.
                      message:
                        description: |
                          Человекочитаемое пояснение текущего статуса.
