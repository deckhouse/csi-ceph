apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    backup.deckhouse.io/cluster-config: "true"
    heritage: deckhouse
    module: csi-ceph
  name: cephclusterauthentications.storage.deckhouse.io
spec:
  group: storage.deckhouse.io
  names:
    kind: CephClusterAuthentication
    plural: cephclusterauthentications
    singular: cephclusterauthentication
  preserveUnknownFields: false
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Deprecated")].status
      name: Deprecated
      type: string
    - jsonPath: .status.reason
      name: Reason
      priority: 1
      type: string
    - description: The age of this resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Ceph cluster authentication parameters.
        properties:
          spec:
            properties:
              userID:
                description: Username without `client.`.
                type: string
              userKey:
                description: Ceph auth key corresponding to the `userID`.
                type: string
            required:
            - userID
            - userKey
            type: object
          status:
            description: Displays current information about the resources managed
              by the CephClusterAuthentication custom resource.
            properties:
              conditions:
                description: |-
                  The latest observations of the resource state. Condition type: `Deprecated`.

                  No `Ready` condition is published: the controller does not reconcile this resource
                  towards a desired state, it only marks it as superseded by CephClusterConnection.
                items:
                  properties:
                    lastTransitionTime:
                      description: Timestamp of the last status transition for this
                        condition.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable explanation of the current status.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The value of `metadata.generation` this condition
                        was set against.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Machine-readable reason for the current status, suitable for log filtering
                        and alerting.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Current status of the condition.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        Condition type. `Deprecated` is `True` for every CephClusterAuthentication:
                        the kind is superseded by CephClusterConnection, which carries the
                        authentication fields itself.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: The value of `metadata.generation` the controller has
                  last acted on.
                format: int64
                type: integer
              phase:
                description: |-
                  Not published for this resource kind. This resource is deprecated and the controller
                  does not reconcile it towards a desired state, so there is no phase to report — see
                  the `Deprecated` condition instead. The field is retained for compatibility.
                enum:
                - Failed
                - Created
                type: string
              reason:
                description: Additional information about the resources managed by
                  the CephClusterAuthentication custom resource.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
