apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    backup.deckhouse.io/cluster-config: "true"
    heritage: deckhouse
    module: csi-ceph
  name: cephclusterconnections.storage.deckhouse.io
spec:
  group: storage.deckhouse.io
  names:
    kind: CephClusterConnection
    plural: cephclusterconnections
    singular: cephclusterconnection
  preserveUnknownFields: false
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.reason
      name: Reason
      priority: 1
      type: string
    - description: The age of this resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Ceph cluster connection parameters.
        properties:
          spec:
            properties:
              cephFS:
                description: CephFS specific parameters (Cluster wide).
                properties:
                  subvolumeGroup:
                    description: CephFS subvolume group name.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: Value is immutable.
                      rule: self == oldSelf
                type: object
              clusterID:
                description: |-
                  Ceph cluster FSID/UUID.

                  Use `ceph fsid` to get Ceph cluster FSID/UUID.
                type: string
                x-kubernetes-validations:
                - message: The clusterID field is immutable.
                  rule: self == oldSelf
              monitors:
                description: List of ceph-mon IP addresses in the format `10.0.0.10:6789`.
                items:
                  type: string
                type: array
              userID:
                description: Ceph user name.
                type: string
              userKey:
                description: Ceph user key.
                minLength: 1
                type: string
            required:
            - clusterID
            - monitors
            - userID
            - userKey
            type: object
          status:
            description: Displays current information about the resources managed
              by the CephClusterConnection custom resource.
            properties:
              conditions:
                description: 'The latest observations of the resource state. Condition
                  type: `Ready`.'
                items:
                  properties:
                    lastTransitionTime:
                      description: |-
                        Timestamp of the last status transition for this condition. It is not bumped
                        when only the reason or the message changes.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable explanation of the current status.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The value of `metadata.generation` this condition
                        was set against.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Machine-readable reason for the current status, suitable for log filtering
                        and alerting.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Current status of the condition.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        Condition type. `Ready` is `True` once the secret and the CSI ConfigMap entry
                        are in place and `False` when a reconcile pass failed. The condition is
                        absent until the controller has processed the resource for the first time.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  The value of `metadata.generation` the controller has last acted on. When it trails
                  `metadata.generation`, the controller has not yet processed the latest spec, and the
                  conditions below still describe the previous one.
                format: int64
                type: integer
              phase:
                description: |-
                  The current state of resources managed by the CephClusterConnection custom resource. Might be:
                  - Failed (if the controller received incorrect resource configuration or some errors occurred during the operation)
                  - Created (if everything went fine)
                enum:
                - Failed
                - Created
                type: string
              reason:
                description: Additional information about the resources managed by
                  the CephClusterConnection custom resource.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: The spec.cephFS field is immutable (cannot be added, removed, or
            changed).
          rule: oldSelf == null || (has(self.spec.cephFS) == has(oldSelf.spec.cephFS)
            && (!has(self.spec.cephFS) || self.spec.cephFS == oldSelf.spec.cephFS))
    served: true
    storage: true
    subresources:
      status: {}
