spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Параметры подключения к кластеру Ceph.
          properties:
            spec:
              properties:
                clusterID:
                  description: |
                    FSID/UUID кластера Ceph.

                    Используйте `ceph fsid`, чтобы получить FSID/UUID кластера Ceph.
                userID:
                  description: |
                    Имя пользователя Ceph.
                userKey:
                  description: |
                    Ключ пользователя Ceph.

                    Если у вызывающей стороны нет прав на подресурс `cephclusterconnections/sensitive`, API возвращает `<omitted>` вместо значения.
                monitors:
                  description: |
                    Список IP-адресов ceph-mon в формате `10.0.0.10:6789`.
                cephFS:
                  description: |
                    Особые параметры CephFS (применяются ко всему кластеру).
                  properties:
                    subvolumeGroup:
                      description: |
                        Имя CephFS subvolumegroup.
                        
                        Используйте `ceph fs subvolumegroup help` для работы с cephfs subvolumegroup.
                        
                        При отсутствии параметра, по-умолчанию используется subvolumegroup `csi`.
            status:
              description: |
                Отображает текущую информацию о ресурсах, управляемых пользовательским ресурсом CephClusterConnection.
              properties:
                phase:
                  description: |
                    Устарело. Вычисляется из условия `Ready`. `Created`, пока `Ready` равно `True`, `Failed`, пока `False`, и отсутствует, пока `Unknown`. Используйте `status.conditions`.
                reason:
                  description: |
                    Устарело. Повторяет сообщение условия `Ready`.
                observedGeneration:
                  description: |
                    Значение `metadata.generation`, которое контроллер обработал последним. Если оно
                    отстаёт от `metadata.generation`, значит контроллер ещё не обработал последнее
                    изменение спецификации, и условия ниже описывают предыдущее состояние.
                conditions:
                  description: |
                    Последние наблюдения состояния ресурса. Тип условия: `Ready`.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия. `Ready` принимает значение `True`, когда секрет и запись
                          в ConfigMap для CSI созданы, и `False` — если проход reconcile завершился
                          ошибкой. Пока контроллер не обработал ресурс в первый раз, условие
                          отсутствует.
                      status:
                        description: |
                          Текущий статус условия.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, для которого это условие было выставлено.
                      lastTransitionTime:
                        description: |
                          Время последней смены статуса этого условия. Не обновляется, если изменились
                          только `reason` или `message`.
                      reason:
                        description: |
                          Машиночитаемая причина текущего статуса, пригодная для фильтрации логов
                          и алертинга.
                      message:
                        description: |
                          Человекочитаемое пояснение текущего статуса.
